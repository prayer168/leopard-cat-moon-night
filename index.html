<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<title>石虎月夜行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：整個畫面是石虎眼中的夜晚田野，介面像夜裡攤開的觀察筆記卡，月光奶油色只留給月亮與重點 */
:root {
  --night: #0b1124;
  --night-2: #131c38;
  --card: #18223f;
  --line: #2b3863;
  --ink: #eef1fa;
  --mute: #a9b4d4;
  --moon: #f3e6b8;
  --lamp: #ffb347;
  --leaf: #8fd694;
  --alert: #ff7a6e;
  --display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink);
  font-family: var(--body); font-size: 18px; line-height: 1.6;
  overflow: hidden; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
button { font-family: var(--body); }
button:focus-visible { outline: 3px solid var(--moon); outline-offset: 2px; }

/* 覆蓋層 */
.layer {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  padding-inline: 16px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  background: rgba(5, 8, 20, 0.62); z-index: 20; box-sizing: border-box;
}
.layer.clear { background: transparent; pointer-events: none; }
.layer.clear > * { pointer-events: auto; }
.panel {
  width: 100%; max-width: 680px; max-height: 100%; overflow-y: auto; box-sizing: border-box;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.45);
}
.panel.wide { max-width: 860px; }
.eyebrow { font-size: 14px; letter-spacing: 0.12em; color: var(--lamp); font-weight: 700; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.25; }
h1 { font-size: clamp(40px, 9vw, 72px); color: var(--moon); letter-spacing: 0.04em; }
h2 { font-size: clamp(26px, 5vw, 34px); color: var(--moon); }
h3 { font-size: 22px; color: var(--ink); }
p { margin: 0; }
.mute { color: var(--mute); }
.small { font-size: 15px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.row.end { justify-content: flex-end; }
.btn {
  min-height: 52px; padding: 10px 22px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--night-2); color: var(--ink); font-size: 19px; font-weight: 700; cursor: pointer;
}
.btn:hover { border-color: var(--mute); }
.btn.primary { background: var(--moon); color: #1c1a10; border-color: var(--moon); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.note {
  background: var(--night-2); border-radius: 12px; padding: 12px 14px; border-left: 4px solid var(--lamp);
}
.note.good { border-left-color: var(--leaf); }
.note.bad { border-left-color: var(--alert); }

/* 標題畫面 */
.title-wrap { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; align-items: center; }
.title-wrap > * { min-width: 0; }
.levels { display: grid; grid-template-columns: 1fr; gap: 8px; }
.lvl-btn {
  display: flex; align-items: center; gap: 12px; text-align: left; min-height: 56px;
  padding: 8px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--night-2);
  color: var(--ink); font-size: 18px; cursor: pointer;
}
.lvl-btn .num {
  font-family: var(--display); font-size: 22px; width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; background: var(--line); color: var(--moon); flex: none;
}
.lvl-btn.done .num { background: var(--leaf); color: #10240f; }
.lvl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.lvl-btn:not(:disabled):hover { border-color: var(--moon); }

/* HUD */
#hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 10; pointer-events: none;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 0; display: flex; gap: 10px;
  justify-content: space-between; align-items: flex-start; flex-wrap: wrap;
}
#hud > * { pointer-events: auto; }
.hud-card {
  background: rgba(19, 28, 56, 0.86); border: 1px solid var(--line); border-radius: 14px;
  padding: 8px 12px; display: flex; gap: 10px; align-items: center;
}
.hud-left { display: flex; flex-direction: column; gap: 6px; }
#hudLevel { font-family: var(--display); color: var(--moon); font-size: 18px; }
#hudCount { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.meter { width: 140px; height: 12px; border-radius: 6px; background: var(--night); overflow: hidden; border: 1px solid var(--line); }
.meter > i { display: block; height: 100%; width: 0%; background: var(--alert); }
#hudSky canvas { display: block; }
#hudSkyText { font-size: 15px; line-height: 1.3; max-width: 8em; }
.hud-btns { display: flex; gap: 8px; }
.hud-btn {
  min-height: 48px; padding: 6px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(19, 28, 56, 0.9); color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer;
}
#hudTip {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 10; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: rgba(19, 28, 56, 0.86); border: 1px solid var(--line); border-radius: 999px; padding: 6px 18px;
  font-size: 16px; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; pointer-events: none;
}
#hudTip.hide-tip { color: var(--leaf); }

/* 搖桿 */
#joy {
  position: fixed; left: 24px; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); width: 132px; height: 132px; border-radius: 50%;
  background: rgba(238, 241, 250, 0.08); border: 2px solid rgba(238, 241, 250, 0.25); z-index: 11; touch-action: none;
}
#joyKnob {
  position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
  background: rgba(243, 230, 184, 0.7); pointer-events: none;
}

/* 月曆 */
.clue { display: flex; gap: 16px; align-items: center; }
.clue canvas { flex: none; }
.cal { display: grid; grid-template-columns: 4.2em repeat(7, 1fr); gap: 6px; }
.cal .wk { font-size: 13px; color: var(--mute); display: flex; align-items: center; line-height: 1.2; }
.cal button {
  min-height: 52px; border-radius: 10px; border: 2px solid var(--line); background: var(--night-2); color: var(--ink);
  font-size: 20px; font-weight: 700; cursor: pointer; padding: 2px; font-variant-numeric: tabular-nums;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
}
.cal button small { font-size: 11px; font-weight: 500; color: var(--mute); }
.cal button.today { border-color: var(--lamp); }
.cal button.sel { background: var(--moon); color: #1c1a10; border-color: var(--moon); }
.cal button.sel small { color: #4a4530; }
.cal button:hover:not(.sel) { border-color: var(--mute); }

/* 小幫手 */
.helper-top { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.helper-top > * { min-width: 0; }
.helper-view { display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
#orbitCanvas { touch-action: none; cursor: grab; max-width: 100%; height: auto; }
.phase-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.phase-cell {
  background: var(--night-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: var(--ink);
}
.phase-cell b { font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--moon); }
.phase-cell span { font-size: 13px; color: var(--mute); line-height: 1.3; text-align: center; }

/* 排列卡片 */
.slots, .pool { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.slot, .pcard {
  aspect-ratio: 3 / 4; max-width: 100%; border-radius: 10px; border: 2px dashed var(--line); background: var(--night);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--mute);
  box-sizing: border-box; padding: 2px; overflow: hidden;
}
.slot.filled { border-style: solid; border-color: var(--leaf); color: var(--ink); }
.slot canvas, .pcard canvas { width: 80%; height: auto; }
.pcard { border-style: solid; border-color: var(--line); background: var(--night-2); cursor: pointer; }
.pcard:hover { border-color: var(--moon); }
.pcard.used { visibility: hidden; }
.pcard.shake { animation: shake 0.4s; border-color: var(--alert); }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* 時間選擇 */
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt {
  min-height: 72px; border-radius: 14px; border: 2px solid var(--line); background: var(--night-2); color: var(--ink);
  font-size: 20px; font-weight: 700; cursor: pointer; padding: 8px;
}
.opt:hover { border-color: var(--moon); }
.rise-table { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rise-table div { background: var(--night-2); border-radius: 10px; padding: 8px; text-align: center; font-size: 15px; line-height: 1.35; }
.rise-table b { display: block; font-family: var(--display); font-weight: 400; color: var(--moon); font-size: 18px; }

.sum-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sum-grid div { background: var(--night-2); border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.sum-grid b { font-family: var(--display); font-weight: 400; color: var(--moon); font-size: 19px; }
.sum-grid span { font-size: 14px; color: var(--mute); line-height: 1.35; }

@media (max-width: 720px) {
  .title-wrap { grid-template-columns: 1fr; }
  .helper-top { grid-template-columns: 1fr; justify-items: center; }
  .slots, .pool { grid-template-columns: repeat(4, 1fr); }
  .rise-table, .sum-grid { grid-template-columns: repeat(2, 1fr); }
  .cal { grid-template-columns: 2.6em repeat(7, 1fr); gap: 4px; }
  .cal .wk { font-size: 11px; }
  .cal button { font-size: 17px; min-height: 46px; }
  .cal button small { display: none; }
  .panel { padding: 18px 16px; }
  .meter { width: 96px; }
}
@media (max-width: 440px) {
  .opts { grid-template-columns: 1fr; }
  #hudSkyText { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .pcard.shake { animation: none; }
}
</style>

<canvas id="stage" aria-label="3D 夜晚田野"></canvas>

<div id="hud" hidden>
  <div class="hud-left">
    <div class="hud-card"><span id="hudLevel">第 1 關</span><span id="hudCount">田鼠 0/4</span></div>
    <div class="hud-card"><span class="small">被發現</span><div class="meter"><i id="hudMeter"></i></div></div>
  </div>
  <div class="hud-card" id="hudSky"><canvas id="hudSkyCanvas" width="56" height="56"></canvas><span id="hudSkyText">今晚的天空</span></div>
  <div class="hud-btns">
    <button class="hud-btn" id="hudHelp" type="button">月相小幫手</button>
    <button class="hud-btn" id="hudMenu" type="button">選單</button>
  </div>
</div>
<div id="hudTip" hidden>躲進草叢，避開手電筒！</div>
<div id="joy" hidden><div id="joyKnob"></div></div>

<div id="layer" class="layer"><div class="panel" id="panel"></div></div>
<div id="helpLayer" class="layer" hidden><div class="panel wide" id="helpPanel"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

/* ========== 月相資料與計算 ========== */
var PI = Math.PI;
var NUM = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
function lunarName(d) {
  if (d <= 10) return '初' + NUM[d];
  if (d < 20) return '十' + NUM[d - 10];
  if (d === 20) return '二十';
  if (d < 30) return '廿' + NUM[d - 20];
  return '三十';
}
var PH = [
  { n: '新月', a: 0, days: '初一前後', rise: '清晨 6 點' },
  { n: '眉形月', a: 45, days: '初二到初六' },
  { n: '上弦月', a: 90, days: '初七、初八', rise: '中午 12 點' },
  { n: '盈凸月', a: 135, days: '初九到十四' },
  { n: '滿月', a: 180, days: '十五、十六', rise: '傍晚 6 點' },
  { n: '虧凸月', a: 225, days: '十七到廿一' },
  { n: '下弦月', a: 270, days: '廿二、廿三', rise: '半夜 12 點' },
  { n: '殘月', a: 315, days: '廿四到廿九' }
];
function phaseIdxOfDay(d) {
  if (d === 1 || d >= 29) return 0;
  if (d <= 6) return 1;
  if (d <= 8) return 2;
  if (d <= 14) return 3;
  if (d <= 16) return 4;
  if (d <= 21) return 5;
  if (d <= 23) return 6;
  return 7;
}
function angleOfDay(d) { return ((d - 1) / 29.5) * 360; }
function illumOf(angle) { return (1 - Math.cos(angle * PI / 180)) / 2; }
function lunarAfter(d, n) { return ((d - 1 + n) % 30) + 1; }
function isNewMoonDay(ld) { return ld === 1 || ld === 29 || ld === 30; }
function brightWord(il) {
  if (il < 0.05) return '幾乎全暗';
  if (il < 0.3) return '只亮一點點';
  if (il < 0.7) return '大約亮一半';
  if (il < 0.95) return '很亮';
  return '最亮';
}

/* 畫月相（臺灣在北半球：漸盈右側亮，漸虧左側亮） */
function drawMoon(ctx, cx, cy, r, angle, opt) {
  opt = opt || {};
  angle = ((angle % 360) + 360) % 360;
  var rad = angle * PI / 180;
  var il = illumOf(angle);
  var waxing = angle <= 180;
  var a = Math.max(Math.abs(Math.cos(rad)) * r, 0.001);
  ctx.save();
  if (il < 0.02) {
    if (opt.outline) {
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = 'rgba(169,180,212,0.7)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, PI * 2); ctx.stroke();
    }
    ctx.restore();
    return;
  }
  if (opt.dark !== false) {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, PI * 2);
    ctx.fillStyle = opt.darkColor || '#222b49'; ctx.fill();
  }
  if (opt.glow) { ctx.shadowColor = 'rgba(243,230,184,0.55)'; ctx.shadowBlur = r * 0.5; }
  ctx.beginPath();
  ctx.moveTo(cx, cy - r);
  ctx.arc(cx, cy, r, -PI / 2, PI / 2, !waxing);
  var crescent = il < 0.5;
  var bulgeRight = (waxing && crescent) || (!waxing && !crescent);
  if (bulgeRight) ctx.ellipse(cx, cy, a, r, 0, PI / 2, -PI / 2, true);
  else ctx.ellipse(cx, cy, a, r, 0, PI / 2, PI * 1.5, false);
  ctx.closePath();
  ctx.fillStyle = '#f3e6b8';
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.clip();
  ctx.fillStyle = 'rgba(150,136,96,0.28)';
  var cr = [[-0.3, -0.25, 0.18], [0.25, 0.1, 0.22], [-0.1, 0.4, 0.12], [0.45, -0.4, 0.1], [-0.5, 0.15, 0.1]];
  for (var i = 0; i < cr.length; i++) {
    ctx.beginPath(); ctx.arc(cx + cr[i][0] * r, cy + cr[i][1] * r, cr[i][2] * r, 0, PI * 2); ctx.fill();
  }
  ctx.restore();
}
var DPR = Math.min(window.devicePixelRatio || 1, 2);
function makeCanvas(w, h) {
  var c = document.createElement('canvas');
  c.width = Math.round(w * DPR); c.height = Math.round(h * DPR);
  c.style.width = w + 'px'; c.style.height = h + 'px';
  var ctx = c.getContext('2d'); ctx.scale(DPR, DPR);
  return c;
}
function moonCanvas(size, angle, bg) {
  var c = makeCanvas(size, size);
  var ctx = c.getContext('2d');
  if (bg) { ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(size / 2, size / 2, size / 2, 0, PI * 2); ctx.fill(); }
  drawMoon(ctx, size / 2, size / 2, size * 0.38, angle, { outline: true });
  return c;
}

/* ========== 小工具 ========== */
function $(id) { return document.getElementById(id); }
function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function btn(label, cls, fn) {
  var b = el('button', 'btn' + (cls ? ' ' + cls : ''), label);
  b.type = 'button';
  b.addEventListener('click', fn);
  return b;
}
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

var store = { done: {} };
try { var raw = localStorage.getItem('shihu-moon-progress'); if (raw) store = JSON.parse(raw) || store; } catch (e) {}
if (!store.done) store.done = {};
function saveStore() { try { localStorage.setItem('shihu-moon-progress', JSON.stringify(store)); } catch (e) {} }
function unlocked(id) { return id === 1 || !!store.done[id - 1] || !!store.done[id]; }

/* ========== 畫面切換 ========== */
var layer = $('layer'), panel = $('panel');
function showPanel(build, wide) {
  panel.innerHTML = '';
  panel.className = 'panel' + (wide ? ' wide' : '');
  build(panel);
  layer.hidden = false;
  panel.scrollTop = 0;
  var f = panel.querySelector('.btn.primary');
  if (f) { try { f.focus({ preventScroll: true }); } catch (e) {} }
}
function hidePanel() { layer.hidden = true; }
function setHud(on) {
  $('hud').hidden = !on; $('hudTip').hidden = !on;
  $('joy').hidden = !(on && isTouch);
}

/* ========== 3D 世界 ========== */
var renderer, scene, camera, hemi, moonLight, nightVision;
var player, farmers = [], targets = [], bushes = [], trees = [];
var ringMat, coneMat, exitRing;
var canvas3d = $('stage');

function canvasTexture(w, h, draw) {
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  var t = new THREE.CanvasTexture(c);
  return t;
}
function lam(color, extra) {
  var o = { color: color };
  if (extra) for (var k in extra) o[k] = extra[k];
  return new THREE.MeshLambertMaterial(o);
}

function makeShihu() {
  var g = new THREE.Group();
  var fur = canvasTexture(128, 128, function (ctx, w, h) {
    ctx.fillStyle = '#b98d55'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#3b2816';
    for (var i = 0; i < 26; i++) {
      ctx.beginPath();
      ctx.ellipse(Math.random() * w, Math.random() * h, 4 + Math.random() * 5, 3 + Math.random() * 3, Math.random() * PI, 0, PI * 2);
      ctx.fill();
    }
  });
  var furMat = lam(0xffffff, { map: fur });
  var body = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.45, 1.1), furMat);
  body.position.y = 0.55; body.castShadow = true; g.add(body);
  var head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.42, 0.45), furMat);
  head.position.set(0, 0.72, -0.72); head.castShadow = true; g.add(head);
  var white = lam(0xf4efe2);
  // 額頭兩條白色縱紋
  for (var s = -1; s <= 1; s += 2) {
    var st = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.02, 0.32), white);
    st.position.set(0.07 * s, 0.94, -0.72); g.add(st);
  }
  var muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.18, 0.12), white);
  muzzle.position.set(0, 0.64, -0.98); g.add(muzzle);
  var earMat = lam(0x2c1d10);
  for (var e = -1; e <= 1; e += 2) {
    var ear = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.24, 4), earMat);
    ear.position.set(0.17 * e, 1.04, -0.66); g.add(ear);

(function setupJoy() {
  var joy = $('joy'), knob = $('joyKnob'), active = null;
  function move(e) {
    var r = joy.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var dx = e.clientX - cx, dy = e.clientY - cy;
    var max = r.width / 2 - 10;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    joyVec.x = dx / max; joyVec.y = dy / max;
  }
  joy.addEventListener('pointerdown', function (e) { active = e.pointerId; joy.setPointerCapture(e.pointerId); move(e); e.preventDefault(); });
  joy.addEventListener('pointermove', function (e) { if (active === e.pointerId) move(e); });
  function end(e) { if (active !== e.pointerId) return; active = null; joyVec.x = 0; joyVec.y = 0; knob.style.transform = ''; }
  joy.addEventListener('pointerup', end);
  joy.addEventListener('pointercancel', end);
})();

function startSneak(cfg) {
  G.run = cfg;
  G.mode = 'sneak'; G.meter = 0; G.collected = 0; G.done = false; G.t = 0; G.hidden = false;
  setNight(cfg.b);
  // 清除舊物件
  var i;
  for (i = 0; i < farmers.length; i++) scene.remove(farmers[i].obj);
  for (i = 0; i < targets.length; i++) scene.remove(targets[i].obj);
  farmers = []; targets = [];
  player.position.set(0, 0, 17); player.rotation.y = 0;
  // 巡田農夫
  var visR = 1.2 + 12 * cfg.b;
  for (i = 0; i < cfg.farmers; i++) {
    var rt = ROUTES[i];
    var obj = makeFarmer();
    obj.position.set(rt.pts[0][0], 0, rt.pts[0][1]);
    obj.userData.ring.scale.set(visR, 1, visR);
    scene.add(obj);
    farmers.push({ obj: obj, route: rt, wp: 1, wait: 0, yaw: 0, phase: Math.random() * 6, speed: rt.speed * (cfg.slow ? 0.6 : 1), visR: visR });
  }
  // 目標
  if (cfg.cards) {
    var order = shuffle([0, 1, 2, 3, 4, 5, 6, 7]);
    var spots = shuffle(MICE_POS.slice()).slice(0, 8);
    for (i = 0; i < 8; i++) {
      var c = makeCard(order[i]);
      c.position.set(spots[i][0], 0, spots[i][1]);
      scene.add(c);
      targets.push({ obj: c, x: spots[i][0], z: spots[i][1], got: false, idx: order[i] });
    }
    G.need = 8;
  } else {
    var ms = shuffle(MICE_POS.slice()).slice(0, cfg.mice);
    for (i = 0; i < ms.length; i++) {
      var m = makeMouse();
      m.position.set(ms[i][0], 0, ms[i][1]);
      scene.add(m);
      targets.push({ obj: m, x: ms[i][0], z: ms[i][1], got: false, ph: Math.random() * 6 });
    }
    G.need = ms.length;
  }
  exitRing.visible = false;
  // HUD
  $('hudLevel').textContent = '第 ' + G.level + ' 關';
  updateCount();
  drawSky(cfg.skyAngle, cfg.moonUp);
  $('hudHelp').disabled = !LV[G.level].helper;

}

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

function update(dt) {
  G.t += dt;
  var i;
  // 目標動畫
  for (i = 0; i < targets.length; i++) {
    var tg = targets[i];
    if (tg.got) continue;
    if (G.run.cards) {
      tg.obj.userData.card.rotation.y += dt * 1.2;
      tg.obj.userData.card.position.y = 1.1 + Math.sin(G.t * 2 + i) * 0.12;
    } else {
      tg.ph += dt * 0.8;
      tg.obj.position.x = tg.x + Math.cos(tg.ph) * 0.8;
      tg.obj.position.z = tg.z + Math.sin(tg.ph) * 0.8;
      tg.obj.rotation.y = -tg.ph + PI;
    }
  }
  exitRing.material.opacity = 0.4 + 0.3 * Math.sin(G.t * 4);
  if (G.mode !== 'sneak' || G.done) return;

  // 玩家移動（畫面向上 = 往前）
  var mx = 0, mz = 0;
  if (keys['arrowleft'] || keys['a']) mx -= 1;
  if (keys['arrowright'] || keys['d']) mx += 1;
  if (keys['arrowup'] || keys['w']) mz -= 1;
  if (keys['arrowdown'] || keys['s']) mz += 1;
  mx += joyVec.x; mz += joyVec.y;
  var len = Math.sqrt(mx * mx + mz * mz);
  var moving = len > 0.15;
  if (len > 1) { mx /= len; mz /= len; }
  var sp = 4.4;
  var p = player.position;
  if (moving) {
    p.x += mx * sp * dt; p.z += mz * sp * dt;
    var targetYaw = Math.atan2(-mx, -mz);
    var dy = targetYaw - player.rotation.y;
    while (dy > PI) dy -= PI * 2;
    while (dy < -PI) dy += PI * 2;
    player.rotation.y += dy * Math.min(1, dt * 12);
  }
  p.x = clamp(p.x, -23, 23); p.z = clamp(p.z, -23, 19);
  for (i = 0; i < trees.length; i++) {
    var tdx = p.x - trees[i].x, tdz = p.z - trees[i].z, td = Math.sqrt(tdx * tdx + tdz * tdz);
    if (td < trees[i].r + 0.4 && td > 0.001) { var push = (trees[i].r + 0.4) / td; p.x = trees[i].x + tdx * push; p.z = trees[i].z + tdz * push; }
  }
  var legs = player.userData.legs;
  for (i = 0; i < 4; i++) legs[i].rotation.x = moving ? Math.sin(G.t * 14 + (i % 2 === 0 ? 0 : PI) + (i > 1 ? PI : 0)) * 0.6 : 0;

  // 躲在草叢裡？
  var hid = false;
  for (i = 0; i < bushes.length; i++) {
    var bx = p.x - bushes[i].x, bz = p.z - bushes[i].z;
    if (bx * bx + bz * bz < bushes[i].r * bushes[i].r) { hid = true; break; }
  }
  if (hid !== G.hidden) {
    G.hidden = hid;
    if (hid) setTip('躲在草叢裡，月光照不到你', 'hide-tip');
    else setTip(G.collected >= G.need ? '快回到竹林！' : (G.run.cards ? '找到發光的月相卡片，避開手電筒！' : '抓到田鼠，避開手電筒，躲進草叢！'));
  }

  // 抓田鼠 / 撿卡片
  for (i = 0; i < targets.length; i++) {
    var tg2 = targets[i];
    if (tg2.got) continue;
    var ox = p.x - tg2.obj.position.x, oz = p.z - tg2.obj.position.z;
    if (ox * ox + oz * oz < 1.1) {
      tg2.got = true; tg2.obj.visible = false; G.collected++;
      updateCount();
      if (G.collected >= G.need) { exitRing.visible = true; setTip('全部到手！快回到竹林（綠色圓圈）'); }
    }
  }
  if (G.collected >= G.need && p.z > 16 && Math.abs(p.x) < 3) { endSneak(true); return; }

  // 農夫巡邏與偵測
  var rate = 0;
  for (i = 0; i < farmers.length; i++) {
    var f = farmers[i], fo = f.obj, rt = f.route.pts;
    var tgt = rt[f.wp];
    var fx = tgt[0] - fo.position.x, fz = tgt[1] - fo.position.z, fd = Math.sqrt(fx * fx + fz * fz);
    if (f.wait > 0) {
      f.wait -= dt;
    } else if (fd < 0.2) {
      f.wp = (f.wp + 1) % rt.length; f.wait = 1.2;
    } else {
      fo.position.x += fx / fd * f.speed * dt; fo.position.z += fz / fd * f.speed * dt;
      var want = Math.atan2(-fz, fx);
      var dd = want - f.yaw;
      while (dd > PI) dd -= PI * 2;
      while (dd < -PI) dd += PI * 2;
      f.yaw += dd * Math.min(1, dt * 3);
    }
    fo.rotation.y = f.yaw;
    var sw = Math.sin(G.t * (f.wait > 0 ? 2.2 : 1.1) + f.phase) * (f.wait > 0 ? 0.9 : 0.35);
    fo.userData.sweep.rotation.y = sw;
    fo.position.y = Math.abs(Math.sin(G.t * 6 + f.phase)) * 0.05;

    var dx = p.x - fo.position.x, dz = p.z - fo.position.z, dist = Math.sqrt(dx * dx + dz * dz);
    var look = f.yaw + sw;
    var lx = Math.cos(look), lz = -Math.sin(look);
    var cosAng = dist > 0.001 ? (dx * lx + dz * lz) / dist : 1;
    var seen = 0;
    if (dist < CONE_LEN && cosAng > Math.cos(CONE_HALF)) seen += hid ? (dist < 2.2 ? 1.6 : 0) : 2.6;
    if (!hid && dist < f.visR) seen += 1.4 * (1 - 0.5 * dist / f.visR);
    if (dist < 1.2) seen += 3;
    fo.userData.alert.visible = seen > 0;
    rate += seen;
  }
  if (rate > 0) G.meter += rate * dt;
  else G.meter = Math.max(0, G.meter - 0.35 * dt);
  $('hudMeter').style.width = Math.min(100, G.meter * 100) + '%';
  if (G.meter >= 1) endSneak(false);
}

var camPos = new THREE.Vector3(0, 14, 28);
function updateCamera(dt) {
  var portrait = window.innerHeight > window.innerWidth;
  var tx, tz, h, back;
  if (G.mode === 'sneak') {
    tx = player.position.x; tz = player.position.z;
    h = portrait ? 18 : 14; back = portrait ? 9.5 : 10.5;

    camera.position.copy(camPos);

    var a = performance.now() * 0.00005;

function showSkyDial(rd, o) {
  var b = windowBright(rd.d, o);
  var other = L5_OPTS[0] === o ? L5_OPTS[1] : L5_OPTS[0];
  var ok = b <= windowBright(rd.d, other);
  var m = moonAt(rd.d, (o.h0 + o.h1) / 2);
  G.choice = { l5: true, d: rd.d, o: o, ok: ok, up: m.up };
  showPanel(function (p) {
    levelHeader(p, 5);
    p.appendChild(el('p', '', '出門前，看看<b>' + o.t + '</b>的南方天空：'));
    var wrap = el('div', ''); wrap.style.textAlign = 'center';
    wrap.appendChild(dialCanvas(rd.d, o));
    p.appendChild(wrap);
    p.appendChild(el('p', 'mute small', m.up ? '月亮在天上，田裡會被月光照亮。' : '月亮還沒升起或已經落下，天空很暗。'));
    var r = el('div', 'row end');
    r.appendChild(btn('換一個時間', '', function () { showTimeChoice(null); }));
    r.appendChild(btn('出發', 'primary', function () {
      startSneak({ b: b, skyAngle: angleOfDay(rd.d), moonUp: m.up, mice: LV[5].mice, farmers: LV[5].farmers });
    }));
    p.appendChild(r);
  });
}
function l5Feedback(caught) {
  var c = G.choice;
  var box = el('div', 'note bad');
  var ph = PH[phaseIdxOfDay(c.d)];
  var why = c.d < 15
    ? ph.n + '大約<b>中午</b>升起、<b>半夜</b>落下，所以晚上 7 點到 10 點月亮還掛在天上。等月亮落下以後再出門吧！'
    : ph.n + '大約<b>半夜</b>才升起，所以凌晨月亮正高高掛著。趁月亮還沒升起的時候出門吧！';
  box.innerHTML = '<b>' + (caught ? '被發現了！' : '你成功溜回來，但只是運氣好。') + '</b>' + why;
  return box;
}

/* ---- 潛入結束 ---- */
function endSneak(win) {
  G.done = true;
  G.mode = 'result';
  setHud(false);
  var id = G.level;
  if (id === 1) {
    if (win) { sortCards(); return; }
    showPanel(function (p) {
      levelHeader(p, 1);
      p.appendChild(el('div', 'note bad', '<b>被手電筒照到了！</b>就算是最暗的新月夜晚，也要避開手電筒的黃色光。躲進草叢可以擋住光線。'));
      var r = el('div', 'row end');
      r.appendChild(btn('回選單', '', goTitle));
      r.appendChild(btn('再試一次', 'primary', briefL1));
      p.appendChild(r);
    });
    return;
  }
  var c = G.choice;
  if (c.ok) {
    if (win) {
      if (id === 5) {
        if (G.l5round === 0) {
          G.l5round = 1;
          var fb = el('div', 'note good', '<b>成功！</b>上弦月大約中午升起、半夜落下，所以<b>後半夜</b>比較暗。換下一個晚上囉！');
          showTimeChoice(fb);
          return;
        }
        clearLevel(5);
        return;
      }
      G.calDay = null;
      clearLevel(id);
      return;
    }
    showPanel(function (p) {
      levelHeader(p, id);
      p.appendChild(el('div', 'note good', '<b>你選的時間是對的！</b>天空很暗，只是不小心被手電筒照到了。'));
      p.appendChild(el('p', 'mute small', '小技巧：農夫停下來的時候，手電筒會左右大範圍掃動，先躲進草叢等一下。'));
      var r = el('div', 'row end');
      r.appendChild(btn('回選單', '', goTitle));
      r.appendChild(btn('再潛入一次', 'primary', function () {
        if (id === 5) showSkyDial(L5_ROUNDS[G.l5round], c.o);
        else launchFromCalendar(id, c.d, c.n);
      }));
      p.appendChild(r);
    });
    return;
  }
  if (id === 5) showTimeChoice(l5Feedback(!win));
  else showCalendar(id, calFeedback(id, !win));
}

var CLEAR_TEXT = {
  1: '月相的順序是：新月、眉形月、上弦月、盈凸月、滿月、虧凸月、下弦月、殘月，再回到新月。變化一輪大約 <b>29.5 天</b>，差不多一個月。',
  2: '新月在農曆<b>初一</b>前後。這時月亮和太陽在同一個方向，被太陽照亮的那一半背對著地球，所以晚上看不到月亮。',
  3: '農曆的日期跟著月相走：初一新月、初七八上弦月、十五六滿月、廿二三下弦月。看農曆就能推算月相！',
  4: '在臺灣看月亮：<b>右邊亮</b>是月亮正在變胖（眉形月、上弦月、盈凸月）；<b>左邊亮</b>是月亮正在變瘦（虧凸月、下弦月、殘月）。',
  5: '下弦月大約半夜才升起，所以<b>前半夜</b>比較暗；上弦月大約半夜落下，所以<b>後半夜</b>比較暗。月相不同，月亮出現的時間也不同。'
};
function clearLevel(id) {
  store.done[id] = true; saveStore();
  G.mode = 'clear';
  setHud(false);
  showPanel(function (p) {
    p.appendChild(el('div', 'eyebrow', '第 ' + id + ' 關 過關'));
    p.appendChild(el('h2', '', id === 1 ? '月相卡片全部排好了！' : '石虎吃飽了，平安回到竹林！'));
    p.appendChild(el('div', 'note good', CLEAR_TEXT[id]));
    var r = el('div', 'row end');
    r.appendChild(btn('回選單', '', goTitle));
    if (id < 5) r.appendChild(btn('下一關', 'primary', function () { openLevel(id + 1); }));
    else r.appendChild(btn('看月相總複習', 'primary', showSummary));
    p.appendChild(r);
  });
}

function showSummary() {
  G.mode = 'summary';
  setHud(false);
  showPanel(function (p) {
    p.appendChild(el('div', 'eyebrow', '全部過關'));
    p.appendChild(el('h2', '', '月相總複習'));
    p.appendChild(el('p', '', '月亮本身不會發光，我們看到的是<b>被太陽照亮的那一半</b>。月亮繞著地球轉，我們看到亮的部分就跟著改變。'));
    var g = el('div', 'sum-grid');
    for (var i = 0; i < 8; i++) {
      var c = el('div');
      c.appendChild(moonCanvas(56, PH[i].a));
      c.appendChild(el('b', '', PH[i].n));
      c.appendChild(el('span', '', '農曆' + PH[i].days + (PH[i].rise ? '<br>' + PH[i].rise + '升起' : '')));
      g.appendChild(c);
    }
    p.appendChild(g);
    p.appendChild(el('div', 'note', '月相不是地球的影子造成的。地球的影子遮住月亮叫做<b>月食</b>，只有在滿月時偶爾發生。'));
    var r = el('div', 'row end');
    r.appendChild(btn('回選單', 'primary', goTitle));
    p.appendChild(r);
  }, true);
}

/* ========== 月相小幫手 ========== */
var helpLayer = $('helpLayer'), helpPanel = $('helpPanel');
var orbitAng = 90;
function openHelper(fromL5) {
  if (G.level && !LV[G.level].helper && (G.mode === 'sneak' || G.mode === 'plan')) return;
  var wasSneak = G.mode === 'sneak';
  if (wasSneak) G.pausedFrom = 'sneak', G.mode = 'paused';
  helpPanel.innerHTML = '';
  helpPanel.appendChild(el('div', 'eyebrow', '月相小幫手'));
  helpPanel.appendChild(el('h2', '', '月亮為什麼會變樣子？'));
  var top = el('div', 'helper-top');
  var oc = makeCanvas(300, 300); oc.id = 'orbitCanvas';
  top.appendChild(oc);
  var view = el('div', 'helper-view');
  var vc = makeCanvas(130, 130);
  var nameEl = el('h3', '', '');
  view.appendChild(el('div', 'small mute', '從臺灣看到的月亮'));
  view.appendChild(vc);
  view.appendChild(nameEl);
  view.appendChild(el('p', 'small', '<b>拖曳</b>左邊圖裡的月亮，讓它繞著地球轉。'));
  view.appendChild(el('p', 'small mute', '月亮自己不會發光。太陽永遠照亮月亮的一半，月亮轉到不同位置，我們從地球看到的亮面就不一樣。'));
  top.appendChild(view);
  helpPanel.appendChild(top);
  helpPanel.appendChild(el('div', 'note small', '月相<b>不是</b>地球影子遮住造成的。在左圖中，地球的影子在背對太陽的那一邊，月亮平常不會走進去。'));
  var grid = el('div', 'phase-grid');
  for (var i = 0; i < 8; i++) {
    (function (i) {
      var c = el('button', 'phase-cell');
      c.type = 'button';
      c.appendChild(moonCanvas(52, PH[i].a));
      c.appendChild(el('b', '', PH[i].n));
      c.appendChild(el('span', '', '農曆' + PH[i].days + (PH[i].rise ? '<br>' + PH[i].rise + '升起' : '')));
      c.addEventListener('click', function () { orbitAng = PH[i].a; redraw(); });
      grid.appendChild(c);
    })(i);
  }
  helpPanel.appendChild(grid);
  var r = el('div', 'row end');
  var closeB = btn('關閉', 'primary', function () {
    helpLayer.hidden = true;
    if (G.mode === 'paused') G.mode = 'sneak';
  });
  r.appendChild(closeB);
  helpPanel.appendChild(r);

  function redraw() {
    var ctx = oc.getContext('2d');
    var W = 300, cx = 150, cy = 150, R = 105;
    ctx.clearRect(0, 0, W, W);
    ctx.fillStyle = '#060a18'; ctx.fillRect(0, 0, W, W);
    // 陽光
    ctx.strokeStyle = 'rgba(255,199,102,0.35)'; ctx.lineWidth = 1.5;
    for (var y = 20; y < W; y += 28) {
      ctx.beginPath(); ctx.moveTo(W - 6, y); ctx.lineTo(W - 40, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W - 40, y); ctx.lineTo(W - 34, y - 4); ctx.moveTo(W - 40, y); ctx.lineTo(W - 34, y + 4); ctx.stroke();
    }
    ctx.fillStyle = '#ffc766'; ctx.font = '13px "Noto Sans TC", sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('太陽光', W - 8, W - 8);
    // 軌道
    ctx.setLineDash([3, 5]); ctx.strokeStyle = 'rgba(169,180,212,0.5)';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, PI * 2); ctx.stroke(); ctx.setLineDash([]);
    // 地球
    halfLit(ctx, cx, cy, 22, '#1d3d78', '#5fa0e8');
    ctx.fillStyle = '#a9b4d4'; ctx.textAlign = 'center'; ctx.fillText('地球', cx, cy + 40);
    // 月亮
    var rad = orbitAng * PI / 180;
    var mx = cx + Math.cos(rad) * R, my = cy - Math.sin(rad) * R;
    halfLit(ctx, mx, my, 13, '#3a4060', '#f3e6b8');
    ctx.fillText('月亮', mx, my + 28);
    ctx.fillStyle = '#a9b4d4'; ctx.textAlign = 'left';
    ctx.fillText('從北極上方往下看', 8, 18);
    var vctx = vc.getContext('2d');
    vctx.clearRect(0, 0, 130, 130);
    vctx.fillStyle = '#060a18'; vctx.beginPath(); vctx.arc(65, 65, 64, 0, PI * 2); vctx.fill();
    drawMoon(vctx, 65, 65, 48, orbitAng, { outline: true, glow: true });
    var idx = Math.round(orbitAng / 45) % 8;
    nameEl.textContent = PH[idx].n;
  }
  function halfLit(ctx, x, y, r, dark, light) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, PI * 2); ctx.fillStyle = dark; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x, y - r); ctx.arc(x, y, r, -PI / 2, PI / 2, false); ctx.closePath(); ctx.fillStyle = light; ctx.fill();
  }
  var dragging = false;
  function setFromEvent(e) {
    var rc = oc.getBoundingClientRect();
    var x = (e.clientX - rc.left) * 300 / rc.width - 150, y = (e.clientY - rc.top) * 300 / rc.height - 150;
    var a = Math.atan2(-y, x) * 180 / PI;
    orbitAng = (a + 360) % 360;
    redraw();
  }
  oc.addEventListener('pointerdown', function (e) { dragging = true; oc.setPointerCapture(e.pointerId); setFromEvent(e); });
  oc.addEventListener('pointermove', function (e) { if (dragging) setFromEvent(e); });
  oc.addEventListener('pointerup', function () { dragging = false; });
  oc.addEventListener('pointercancel', function () { dragging = false; });
  redraw();
  helpLayer.hidden = false;
  helpPanel.scrollTop = 0;
  try { closeB.focus({ preventScroll: true }); } catch (e) {}
}

$('hudHelp').addEventListener('click', function () { openHelper(false); });
$('hudMenu').addEventListener('click', function () {
  G.mode = 'paused';
  showPanel(function (p) {
    p.appendChild(el('h2', '', '暫停'));
    p.appendChild(el('p', '', '要繼續潛入，還是回到選單？'));
    var r = el('div', 'row end');
    r.appendChild(btn('回選單', '', goTitle));
    r.appendChild(btn('繼續', 'primary', function () { hidePanel(); G.mode = 'sneak'; }));
    p.appendChild(r);
  });
});
window.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !helpLayer.hidden) { helpLayer.hidden = true; if (G.mode === 'paused' && layer.hidden) G.mode = 'sneak'; }
});

/* ========== 啟動 ========== */
function boot() {
  if (typeof THREE === 'undefined') {
    showPanel(function (p) {
      p.appendChild(el('h2', '', '無法載入 3D 畫面'));
      p.appendChild(el('p', '', '請確認網路連線後重新整理頁面。'));
    });
    return;
  }
  try {
    buildWorld();
  } catch (err) {
    showPanel(function (p) {
      p.appendChild(el('h2', '', '這台裝置無法顯示 3D 畫面'));
      p.appendChild(el('p', '', '請換一個瀏覽器（建議 Chrome 或 Safari）再試一次。'));
    });
    return;
  }
  // 標題畫面背景：放幾隻農夫與田鼠
  startSneakPreview();
  goTitle();
  loop();
}
function startSneakPreview() {
  var f = makeFarmer(); f.position.set(-4, 0, -2); f.rotation.y = 0.6; f.userData.ring.scale.set(4, 1, 4); scene.add(f);
  farmers.push({ obj: f, route: ROUTES[0], wp: 1, wait: 0, yaw: 0.6, phase: 0, speed: 0, visR: 4 });
  player.position.set(3, 0, 6); player.rotation.y = 0.8;
}
boot();
})();
