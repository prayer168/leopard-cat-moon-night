<title>石虎月夜行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;900&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* 版面概念：盜賊電影裡的作戰計畫板。軟木板、拍立得、紅線、膠帶與印章；3D 行動畫面的介面是貼在螢幕上的紙片 */
:root {
  --cork: #b4885a;
  --cork-dark: #7d5a37;
  --paper: #f7f2e6;
  --paper-2: #ece2c8;
  --ink: #2b2420;
  --ink-soft: #6e5f50;
  --string: #c4332a;
  --tape: rgba(242, 228, 168, 0.88);
  --hi: #ffe14d;
  --night: #0e1a33;
  --moon: #f3e6b8;
  --hand: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", serif;
  --stamp: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --title: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--cork); color: var(--ink);
  font-family: var(--hand); font-size: 19px; line-height: 1.5;
  overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--string); outline-offset: 3px; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- 軟木板 ---------- */
.board {
  position: fixed; inset: 0; z-index: 20; overflow-y: auto; overflow-x: hidden;
  background-color: var(--cork); background-size: 220px 220px;
  box-shadow: inset 0 0 0 10px var(--cork-dark), inset 0 0 60px rgba(60, 35, 10, 0.55);
  padding-inline: 16px;
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
}
.board-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.paper {
  background: var(--paper); color: var(--ink); border-radius: 2px; position: relative;
  box-shadow: 0 2px 0 rgba(0,0,0,0.08), 0 10px 22px rgba(40, 22, 6, 0.35);
}
.tape::before {
  content: ""; position: absolute; top: -12px; left: 50%; width: 92px; height: 26px; margin-left: -46px;
  background: var(--tape); transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.pin::after {
  content: ""; position: absolute; top: -8px; left: 50%; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ff8a7a, var(--string) 55%, #7a1712);
  box-shadow: 0 3px 4px rgba(0,0,0,0.35);
}

.topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.file-tab {
  background: #d9c08a; padding: 8px 18px 10px; border-radius: 8px 8px 0 0; color: var(--ink);
  box-shadow: 0 6px 14px rgba(40, 22, 6, 0.35); display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
}
.file-tab .code { font-family: var(--stamp); font-weight: 900; letter-spacing: 0.12em; font-size: 14px; color: var(--ink-soft); }
.file-tab .night { font-family: var(--title); font-weight: 900; font-size: 26px; }
.tag-btn {
  font-family: var(--stamp); font-weight: 900; font-size: 15px; letter-spacing: 0.06em; cursor: pointer;
  background: var(--paper); border: 0; padding: 10px 14px; min-height: 46px; border-radius: 3px;
  box-shadow: 0 6px 12px rgba(40, 22, 6, 0.3); transform: rotate(1.5deg);
}
.tag-btn:nth-child(2) { transform: rotate(-2deg); }
.tag-btn:hover { background: #fff; }
.tags { display: flex; gap: 10px; flex-wrap: wrap; }

.cols { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr) minmax(0, 300px); gap: 26px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }

.polaroid { padding: 12px 12px 14px; transform: rotate(-2deg); }
.polaroid .photo { width: 100%; aspect-ratio: 5 / 4; background: var(--night); display: block; }
.polaroid .cap { font-size: 24px; line-height: 1.25; padding-top: 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.polaroid .cap b { font-weight: 700; font-size: 28px; }
.polaroid .cap span { color: var(--ink-soft); font-size: 18px; }

.timeline { padding: 14px 14px 12px; transform: rotate(1deg); }
.timeline h3, .card h3 { margin: 0 0 8px; font-family: var(--stamp); font-weight: 900; font-size: 15px; letter-spacing: 0.1em; color: var(--ink-soft); }
.tl-bar { position: relative; height: 34px; background: #1b2747; border-radius: 4px; overflow: hidden; }
.tl-moon { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, #f3e6b8, #f3e6b8 8px, #e8d79c 8px, #e8d79c 16px); }
.tl-win { position: absolute; top: 0; bottom: 0; border: 3px solid var(--string); border-radius: 4px; box-sizing: border-box; }
.tl-ticks { display: flex; justify-content: space-between; font-family: var(--stamp); font-size: 12px; color: var(--ink-soft); padding-top: 3px; font-variant-numeric: tabular-nums; }
.tl-legend { font-size: 15px; color: var(--ink-soft); padding: 4px 0 10px; }
.dep { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dep button {
  min-height: 54px; border: 2px dashed var(--ink-soft); background: transparent; border-radius: 6px; cursor: pointer;
  font-size: 18px; line-height: 1.15; padding: 4px;
}
.dep button small { display: block; font-size: 13px; color: var(--ink-soft); }
.dep button.on { border-style: solid; border-color: var(--string); background: rgba(196, 51, 42, 0.1); }

.journal { padding: 18px 16px 16px; }
.journal-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.journal-head h2 { margin: 0; font-family: var(--title); font-weight: 900; font-size: 26px; }
.journal-head span { color: var(--ink-soft); font-size: 16px; }
.jwrap { position: relative; }
.jgrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; position: relative; }
.slot {
  aspect-ratio: 1 / 1.08; background: var(--paper-2); border-radius: 3px; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.slot canvas { width: 58% !important; height: auto !important; }
.slot .ld { font-size: 14px; line-height: 1; }
.slot.future { background: repeating-linear-gradient(-45deg, var(--paper-2), var(--paper-2) 6px, #e4d8b9 6px, #e4d8b9 12px); color: var(--ink-soft); font-size: 22px; }
.slot.today { background: var(--hi); box-shadow: 0 0 0 3px var(--string); }
.slot .mark {
  position: absolute; right: 2px; bottom: 2px; font-family: var(--stamp); font-weight: 900; font-size: 11px;
  padding: 0 4px; border-radius: 3px; transform: rotate(-8deg); line-height: 1.3; background: var(--paper-2);
}
.mark.ok { color: #1f6b33; border: 1.5px solid #1f6b33; }
.mark.bad { color: var(--string); border: 1.5px solid var(--string); }
.mark.zz { color: var(--ink-soft); border: 1.5px solid var(--ink-soft); }
.jstring { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }

.card { padding: 14px 16px; }
.stat-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-size: 18px; }
.mice { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.mice svg { width: 22px; height: 16px; }
.hunger { display: flex; gap: 6px; margin-top: 6px; }
.hunger i { width: 22px; height: 22px; border-radius: 50%; border: 2px dashed var(--ink-soft); display: block; box-sizing: border-box; }
.hunger i.on { background: var(--string); border: 2px solid var(--string); }
.threat { display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.threat svg { width: 30px; height: 30px; }
.sticky {
  background: #fff3a8; padding: 14px 14px 16px; font-size: 18px; line-height: 1.45; transform: rotate(1.5deg);
  box-shadow: 0 10px 18px rgba(40, 22, 6, 0.3); position: relative;
}
.sticky:nth-child(even) { transform: rotate(-1.5deg); background: #ffe9a0; }
.sticky .who { font-family: var(--stamp); font-weight: 900; font-size: 13px; letter-spacing: 0.1em; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.sticky .new { background: var(--string); color: #fff; padding: 0 6px; border-radius: 3px; font-size: 12px; }

.go {
  font-family: var(--stamp); font-weight: 900; font-size: 30px; letter-spacing: 0.08em; color: var(--string);
  background: rgba(247, 242, 230, 0.92); border: 5px double var(--string); border-radius: 10px; padding: 10px 18px;
  cursor: pointer; transform: rotate(-3deg); min-height: 72px; box-shadow: 0 8px 16px rgba(40, 22, 6, 0.3);
}
.go:hover:not(:disabled) { background: #fff; transform: rotate(-3deg) scale(1.03); }
.go:disabled { opacity: 0.5; cursor: not-allowed; }
.sleep {
  font-size: 19px; background: var(--paper); border: 0; padding: 10px 16px; min-height: 52px; cursor: pointer;
  box-shadow: 0 6px 12px rgba(40, 22, 6, 0.3); transform: rotate(1.5deg); border-radius: 2px;
}
.sleep:hover { background: #fff; }
.actions { display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
.hint { font-size: 16px; color: var(--paper); text-shadow: 0 1px 2px rgba(0,0,0,0.7); text-align: center; }

.title-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 34px; align-items: center; padding-top: 2vh; }
.folder { padding: 30px 30px 26px; background: #d9c08a; border-radius: 4px; position: relative; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 14px 30px rgba(40,22,6,0.45); }
.folder .label { font-family: var(--stamp); font-weight: 900; letter-spacing: 0.2em; font-size: 14px; color: var(--ink-soft); }
.folder h1 { margin: 0; font-family: var(--title); font-weight: 900; font-size: clamp(46px, 9vw, 92px); line-height: 1.05; letter-spacing: 0.04em; }
.folder p { margin: 0; font-size: 20px; }
.stamp {
  position: absolute; right: 18px; top: 18px; font-family: var(--stamp); font-weight: 900; font-size: 22px; letter-spacing: 0.2em;
  color: var(--string); border: 4px solid var(--string); padding: 2px 10px; transform: rotate(12deg); opacity: 0.85; border-radius: 6px;
}
.title-btns { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 6px; }
.suspect { padding: 12px 12px 14px; transform: rotate(3deg); }
.suspect img { width: 100%; display: block; aspect-ratio: 4 / 3; object-fit: cover; background: var(--night); }
.suspect .cap { font-size: 22px; padding-top: 6px; }
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }

#hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
#hud > * { pointer-events: auto; }
#hud #burst, #hud #banner { pointer-events: none; }
.scrap { background: var(--paper); box-shadow: 0 6px 14px rgba(0,0,0,0.45); border-radius: 2px; }
#hudClock { position: absolute; left: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); padding: 6px 14px 8px; transform: rotate(-2deg); }
#hudClock .t { font-family: var(--stamp); font-weight: 900; font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1.1; }
#hudClock .s { font-size: 15px; color: var(--ink-soft); }
#hudLoot { position: absolute; left: 16px; top: calc(96px + env(safe-area-inset-top, 0px)); padding: 6px 12px; transform: rotate(1.5deg); font-size: 20px; display: flex; gap: 8px; align-items: center; }
#hudLoot b { font-family: var(--stamp); font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; }
#hudEye { position: absolute; left: 16px; top: calc(146px + env(safe-area-inset-top, 0px)); padding: 6px 12px; transform: rotate(-1deg); display: flex; gap: 8px; align-items: center; font-size: 16px; }
.eyebar { width: 110px; height: 12px; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
.eyebar i { display: block; height: 100%; width: 0; background: var(--string); }
#hudSky { position: absolute; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%) rotate(1.5deg); padding: 6px 6px 4px; text-align: center; }
#hudSky canvas { display: block; }
#hudSky span { font-size: 14px; display: block; line-height: 1.3; }
#hudBtns { position: absolute; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; flex-direction: column; align-items: flex-end; }
#hudBtns button { font-family: var(--stamp); font-weight: 900; font-size: 15px; min-height: 46px; padding: 6px 12px; border: 0; cursor: pointer; }
#hudTip { position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) rotate(-1deg); padding: 6px 16px; font-size: 18px; max-width: calc(100% - 200px); text-align: center; }
#burst {
  position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%) rotate(-6deg); font-family: var(--stamp); font-weight: 900;
  font-size: clamp(30px, 6vw, 54px); color: #fff; background: var(--string); padding: 6px 22px; border-radius: 8px;
  box-shadow: 0 0 0 5px #fff, 0 10px 20px rgba(0,0,0,0.5); letter-spacing: 0.06em; white-space: nowrap;
}
#banner {
  position: absolute; left: 50%; top: 20%; transform: translate(-50%, 0) rotate(1deg); background: var(--hi); padding: 10px 22px;
  font-size: 24px; font-weight: 700; box-shadow: 0 8px 18px rgba(0,0,0,0.45); text-align: center; max-width: calc(100% - 32px); box-sizing: border-box;
}
#vig { position: fixed; inset: 0; pointer-events: none; z-index: 9; box-shadow: inset 0 0 120px 30px rgba(196, 51, 42, 0.9); opacity: 0; }
#joy {
  position: absolute; left: 22px; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); width: 136px; height: 136px; border-radius: 50%;
  border: 3px dashed rgba(247, 242, 230, 0.6); background: rgba(247, 242, 230, 0.08); touch-action: none;
}
#joyKnob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: var(--paper); box-shadow: 0 4px 10px rgba(0,0,0,0.4); pointer-events: none; }

.sheet-layer { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(20, 12, 4, 0.55); padding-inline: 16px; padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
.sheet { width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; box-sizing: border-box; padding: 26px 24px 22px; display: flex; flex-direction: column; gap: 14px; transform: rotate(-1deg); }
.sheet.wide { max-width: 860px; transform: none; }
.sheet h2 { margin: 0; font-family: var(--title); font-weight: 900; font-size: 30px; line-height: 1.2; }
.sheet p { margin: 0; }
.big-stamp { align-self: flex-start; font-family: var(--stamp); font-weight: 900; font-size: 28px; letter-spacing: 0.15em; padding: 2px 14px; border: 5px solid currentColor; border-radius: 8px; transform: rotate(-6deg); }
.big-stamp.ok { color: #1f6b33; }
.big-stamp.bad { color: var(--string); }
.sheet .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.btn-paper { font-family: var(--stamp); font-weight: 900; font-size: 17px; min-height: 50px; padding: 8px 18px; border: 2px solid var(--ink); background: var(--paper); cursor: pointer; border-radius: 4px; }
.btn-paper.red { background: var(--string); color: #fff; border-color: var(--string); }
.loot-line { font-size: 22px; }
.why { background: var(--paper-2); padding: 10px 12px; border-left: 5px solid var(--string); font-size: 18px; }
.why.ok { border-left-color: #1f6b33; }
.helper-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
#orbitCanvas { touch-action: none; cursor: grab; max-width: 100%; height: auto !important; }
.phase-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.phase-cell { background: var(--paper-2); border: 0; border-radius: 3px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
.phase-cell b { font-size: 19px; }
.phase-cell span { font-size: 13px; color: var(--ink-soft); line-height: 1.3; text-align: center; }
.notes-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.final-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.final-grid div { background: var(--paper-2); border-radius: 3px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; }
.final-grid canvas { width: 60% !important; height: auto !important; }
.final-grid b { font-size: 15px; line-height: 1.2; }
.final-grid span { font-size: 12px; color: var(--ink-soft); }

@media (max-width: 1000px) {
  .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .col.c-journal { grid-column: 1 / -1; order: 3; }
}
@media (max-width: 680px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .title-grid, .rules, .notes-list, .helper-top { grid-template-columns: minmax(0, 1fr); }
  .helper-top { justify-items: center; }
  .jgrid, .final-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .phase-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #hudTip { max-width: calc(100% - 32px); bottom: calc(220px + env(safe-area-inset-bottom, 0px)); font-size: 16px; }
  #hudSky { top: calc(64px + env(safe-area-inset-top, 0px)); left: auto; right: 16px; transform: rotate(1.5deg); }
  #hudBtns { flex-direction: row; }
  .eyebar { width: 80px; }
}
@media (prefers-reduced-motion: reduce) {
  .go:hover:not(:disabled) { transform: rotate(-3deg); }
}
</style>

<canvas id="stage" aria-label="夜晚的田野"></canvas>
<div id="vig"></div>
<div id="hud" hidden>
  <div id="hudClock" class="scrap"><div class="t" id="hudTime">19:00</div><div class="s" id="hudLeft">還有 3 小時</div></div>
  <div id="hudLoot" class="scrap">田鼠 <b id="hudGot">0</b></div>
  <div id="hudEye" class="scrap">被發現<div class="eyebar"><i id="hudMeter"></i></div></div>
  <div id="hudSky" class="scrap"><canvas id="hudSkyCanvas" width="120" height="66"></canvas><span id="hudSkyText">南方天空</span></div>
  <div id="hudBtns"><button type="button" class="scrap" id="btnPause">暫停</button><button type="button" class="scrap" id="btnSound">聲音：開</button></div>
  <div id="hudTip" class="scrap">抓田鼠，再回到竹林的綠圈</div>
  <div id="burst" hidden>被看見了！</div>
  <div id="banner" hidden></div>
  <div id="joy" hidden><div id="joyKnob"></div></div>
</div>
<div id="board" class="board"></div>
<div id="sheetLayer" class="sheet-layer" hidden><div id="sheet" class="sheet paper"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
var PI = Math.PI;

/* ================= 月相與月出 ================= */
var NUM = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
function lunarName(d) {
  if (d <= 10) return '初' + NUM[d];
  if (d < 20) return '十' + NUM[d - 10];
  if (d === 20) return '二十';
  if (d < 30) return '廿' + NUM[d - 20];
  return '三十';
}
var PH = [
  { n: '新月', a: 0, days: '初一前後', rise: '清晨 6 點' },
  { n: '眉形月', a: 45, days: '初二到初六' },
  { n: '上弦月', a: 90, days: '初七、初八', rise: '中午 12 點' },
  { n: '盈凸月', a: 135, days: '初九到十四' },
  { n: '滿月', a: 180, days: '十五、十六', rise: '傍晚 6 點' },
  { n: '虧凸月', a: 225, days: '十七到廿一' },
  { n: '下弦月', a: 270, days: '廿二、廿三', rise: '半夜 12 點' },
  { n: '殘月', a: 315, days: '廿四到廿九' }
];
function phaseIdx(d) {
  if (d === 1 || d >= 29) return 0;
  if (d <= 6) return 1;
  if (d <= 8) return 2;
  if (d <= 14) return 3;
  if (d <= 16) return 4;
  if (d <= 21) return 5;
  if (d <= 23) return 6;
  return 7;
}
function angleOf(d) { return ((d - 1) / 29.5) * 360; }
function illum(angle) { return (1 - Math.cos(angle * PI / 180)) / 2; }
function lunarAfter(d, n) { return ((d - 1 + n) % 30) + 1; }
function riseHour(d) { return 6 + (d - 1) * 24 / 29.5; }
function moonAt(d, h) {
  var x = (((h - riseHour(d)) % 24) + 24) % 24;
  return { up: x < 12, f: x / 12, x: x, alt: x < 12 ? Math.sin(PI * x / 12) : 0 };
}

function startRun(depH) {
  audioInit();
  var ld = tonightLD();
  var b0 = brightAt(ld, depH + 0.5);
  var nMice = 3 + Math.round(5 * (1 - Math.min(1, b0 * 1.3)));
  R = { ld: ld, h0: depH, t: 0, got: 0, ended: false, meter: 0, hidden: false, inWater: false, trail: [], trailT: 0, lastUp: null, left: false, cause: '', bannerT: 0, spotSfxT: 0, barkT: 0, curB: 0 };

    farmers.push({ obj: fo, route: rt, wp: 1, wait: 0, yaw: 0, phase: i * 2.1, speed: rt.speed * (1 + 0.04 * C.raids), visR: 1 });
  }
  var spots = shuffle(MICE_POS.slice()).slice(0, nMice);
  for (i = 0; i < spots.length; i++) { var m = makeMouse(); m.position.set(spots[i][0], 0, spots[i][1]); scene.add(m); mice.push({ obj: m, x: spots[i][0], z: spots[i][1], ph: i * 1.7, got: false }); }

  dogObj.position.set(kennelPos.x, 0, kennelPos.z);
  dogObj.userData.bub.visible = false; dogObj.userData.q.visible = false;

  R.total = nMice;

}

}

  else if (m.up) txt = '月亮在天上';

function update(dt) {
  if (!R) return;
  var i, t = performance.now() / 1000;
  for (i = 0; i < mice.length; i++) {
    var ms = mice[i]; if (ms.got) continue;
    ms.ph += dt * 0.8; ms.obj.position.x = ms.x + Math.cos(ms.ph) * 0.8; ms.obj.position.z = ms.z + Math.sin(ms.ph) * 0.8; ms.obj.rotation.y = -ms.ph + PI;
  }
  var fp = fireflies.geometry.attributes.position, base = fireflies.userData.base;
  for (i = 0; i < 40; i++) { fp.array[i * 3] = base[i * 3] + Math.sin(t * 0.7 + i) * 0.8; fp.array[i * 3 + 1] = base[i * 3 + 1] + Math.sin(t * 1.3 + i * 2) * 0.3; fp.array[i * 3 + 2] = base[i * 3 + 2] + Math.cos(t * 0.5 + i) * 0.8; }
  fp.needsUpdate = true;
  exitRing.material.opacity = 0.4 + 0.3 * Math.sin(t * 4);
  if (R.ended || paused) return;

  R.t += dt;
  if (R.bannerT > 0) { R.bannerT -= dt; if (R.bannerT <= 0) $('banner').hidden = true; }
  var h = nowHour();
  if (Math.floor(R.t * 2) !== Math.floor((R.t - dt) * 2)) { updateRunLight(false); drawHudSky(); }
  $('hudTime').textContent = clockText(h);
  var left = R.h0 + RUN_HOURS - h;
  $('hudLeft').textContent = left > 1 ? '還有 ' + Math.ceil(left) + ' 小時' : '快回家！剩 ' + Math.max(0, Math.ceil(left * 60)) + ' 分鐘';
  if (left <= 0) { endRun('time'); return; }

  // 石虎
  var mx = 0, mz = 0;
  if (keys.arrowleft || keys.a) mx -= 1;
  if (keys.arrowright || keys.d) mx += 1;
  if (keys.arrowup || keys.w) mz -= 1;
  if (keys.arrowdown || keys.s) mz += 1;
  mx += joyVec.x; mz += joyVec.y;
  var len = Math.sqrt(mx * mx + mz * mz), moving = len > 0.15;
  if (len > 1) { mx /= len; mz /= len; }
  var p = player.position;
  var inWater = Math.abs(p.z - DITCH_Z) < DITCH_HALF && !(p.x > BRIDGE_X0 && p.x < BRIDGE_X1);
  var sp = inWater ? 2.4 : 4.4;
  if (moving) {
    p.x += mx * sp * dt; p.z += mz * sp * dt;
    var dy = Math.atan2(-mx, -mz) - player.rotation.y;
    while (dy > PI) dy -= PI * 2; while (dy < -PI) dy += PI * 2;
    player.rotation.y += dy * Math.min(1, dt * 12);
  }
  p.x = clamp(p.x, -23, 23); p.z = clamp(p.z, -23, 19);
  for (i = 0; i < trees.length; i++) {

  }
  p.y = inWater ? -0.25 : 0;
  var legs = player.userData.legs;
  for (i = 0; i < 4; i++) legs[i].rotation.x = moving ? Math.sin(t * 14 + (i % 2 ? PI : 0) + (i > 1 ? PI : 0)) * 0.6 : 0;

  // 氣味與水圳
  if (inWater && !R.inWater) {
    SFX.splash();
    if (R.trail.length) { R.trail = []; if (R.dog) R.dog.idx = 0; if (R.dog && R.dog.st === 'track') { R.dog.st = 'lost'; R.dog.t = 3; } }
    setTip('在水圳裡，氣味斷了！');
  }
  if (!inWater && R.inWater) setTip('抓田鼠，再回到竹林的綠圈');
  R.inWater = inWater;
  if (!inWater && moving) {
    R.trailT += dt;
    if (R.trailT > 0.35) { R.trailT = 0; R.trail.push({ x: p.x, z: p.z, t: R.t }); }
  }
  while (R.trail.length && R.t - R.trail[0].t > 30) { R.trail.shift(); if (R.dog && R.dog.idx > 0) R.dog.idx--; }

  // 草叢
  var hid = false;
  for (i = 0; i < bushes.length; i++) { var bx = p.x - bushes[i].x, bz = p.z - bushes[i].z; if (bx * bx + bz * bz < bushes[i].r * bushes[i].r) { hid = true; break; } }
  if (hid !== R.hidden) { R.hidden = hid; if (!inWater) setTip(hid ? '躲在草叢裡，月光照不到你' : '抓田鼠，再回到竹林的綠圈'); }

  // 抓田鼠
  for (i = 0; i < mice.length; i++) {
    var mo = mice[i]; if (mo.got) continue;
    var ox = p.x - mo.obj.position.x, oz = p.z - mo.obj.position.z;
    if (ox * ox + oz * oz < 1.1) { mo.got = true; mo.obj.visible = false; R.got++; SFX.pick(); $('hudGot').textContent = R.got + ' / ' + R.total; }
  }
  if (p.z < 14) R.left = true;
  if (R.left && p.z > 16 && Math.abs(p.x) < 3) { endRun('home'); return; }

  // 巡田農夫
  var rate = 0, top = '', topRate = 0;
  for (i = 0; i < farmers.length; i++) {
    var f = farmers[i], fo = f.obj, tg = f.route.pts[f.wp];
    var fx = tg[0] - fo.position.x, fz = tg[1] - fo.position.z, fd = Math.sqrt(fx * fx + fz * fz);
    if (f.wait > 0) f.wait -= dt;
    else if (fd < 0.2) { f.wp = (f.wp + 1) % f.route.pts.length; f.wait = 1.2; }
    else {
      fo.position.x += fx / fd * f.speed * dt; fo.position.z += fz / fd * f.speed * dt;
      var dd = Math.atan2(-fz, fx) - f.yaw; while (dd > PI) dd -= PI * 2; while (dd < -PI) dd += PI * 2;
      f.yaw += dd * Math.min(1, dt * 3);
    }
    fo.rotation.y = f.yaw;
    var sw = Math.sin(t * (f.wait > 0 ? 2.2 : 1.1) + f.phase) * (f.wait > 0 ? 0.9 : 0.35);
    fo.userData.sweep.rotation.y = sw;
    var dx = p.x - fo.position.x, dz = p.z - fo.position.z, dist = Math.sqrt(dx * dx + dz * dz);
    var lk = f.yaw + sw, cosA = dist > 0.001 ? (dx * Math.cos(lk) - dz * Math.sin(lk)) / dist : 1;
    var sLight = 0, sMoon = 0;
    if (dist < CONE_LEN && cosA > Math.cos(CONE_HALF)) sLight = hid ? (dist < 2.2 ? 1.6 : 0) : 2.6;
    if (!hid && dist < f.visR && R.curB > 0.03) sMoon = 1.4 * (1 - 0.5 * dist / f.visR);
    if (dist < 1.2) sLight += 3;
    fo.userData.bub.visible = sLight + sMoon > 0;
    rate += sLight + sMoon;
    if (sLight > topRate) { topRate = sLight; top = 'light'; }
    if (sMoon > topRate) { topRate = sMoon; top = 'moon'; }
  }

  // 循氣味追蹤的狗
  var D = R.dog;
  if (D) {
    var dog = dogObj, dpos = dog.position, ud = dog.userData, dspeed = 0, tgx = null, tgz = null;
    D.t -= dt;
    ud.tail.rotation.z = Math.sin(t * 12) * 0.5;
    if (D.st === 'sleep') {
      D.cool -= dt;
      if (D.cool <= 0 && R.trail.length > 4) { D.st = 'track'; D.idx = 0; SFX.bark(); ud.bub.visible = true; D.t = 1.2; showBanner('狗醒了！牠聞到你的氣味了'); }
    } else if (D.st === 'track') {
      if (D.t <= 0) ud.bub.visible = false;
      if (D.idx < R.trail.length) {
        tgx = R.trail[D.idx].x; tgz = R.trail[D.idx].z;
        var ax = tgx - dpos.x, az = tgz - dpos.z;
        if (ax * ax + az * az < 0.5) D.idx++;
      } else if (!R.inWater) { tgx = p.x; tgz = p.z; }
      dspeed = 3.3 + 0.12 * C.raids;
      R.barkT -= dt;
      var pdx = p.x - dpos.x, pdz = p.z - dpos.z, pd = Math.sqrt(pdx * pdx + pdz * pdz);
      if (pd < 6 && R.barkT <= 0) { SFX.bark(); ud.bub.visible = true; D.t = 0.8; R.barkT = 1.6; }
      if (pd < 1.8) { rate += 3.5; if (3.5 > topRate) { topRate = 3.5; top = 'dog'; } }
    } else if (D.st === 'lost') {
      ud.q.visible = true; ud.bub.visible = false;
      if (D.t <= 0) { D.st = 'home'; ud.q.visible = false; }
    } else if (D.st === 'home') {
      tgx = kennelPos.x; tgz = kennelPos.z; dspeed = 2.2;
      var hx = tgx - dpos.x, hz = tgz - dpos.z;
      if (hx * hx + hz * hz < 0.3) { D.st = 'sleep'; D.cool = 10; }
    }
    if (tgx !== null && dspeed > 0) {
      var vx = tgx - dpos.x, vz = tgz - dpos.z, vd = Math.sqrt(vx * vx + vz * vz);
      if (vd > 0.05) {
        var stp = Math.min(vd, dspeed * dt); dpos.x += vx / vd * stp; dpos.z += vz / vd * stp;
        dog.rotation.y = Math.atan2(-vx, -vz);
        for (i = 0; i < 4; i++) ud.legs[i].rotation.x = Math.sin(t * 16 + (i % 2 ? PI : 0)) * 0.7;
      }
    } else for (i = 0; i < 4; i++) ud.legs[i].rotation.x = 0;
  }

  var wasLow = R.meter < 0.05;
  if (rate > 0) { R.meter += rate * dt; if (top) R.cause = top; } else R.meter = Math.max(0, R.meter - 0.35 * dt);
  R.spotSfxT -= dt;
  if (rate > 0 && wasLow && R.spotSfxT <= 0) { SFX.spot(); R.spotSfxT = 2; }
  $('burst').hidden = !(rate > 0);
  $('vig').style.opacity = Math.min(0.85, R.meter);
  $('hudMeter').style.width = Math.min(100, R.meter * 100) + '%';
  tension = Math.min(1, R.meter);
  if (R.meter >= 1) endRun('caught');
}

var camPos = new THREE.Vector3(0, 14, 28);
function updateCamera(dt) {
  var portrait = window.innerHeight > window.innerWidth;
  var tx = player.position.x, tz = player.position.z;
  camPos.lerp(new THREE.Vector3(tx, portrait ? 18 : 14, tz + (portrait ? 9.5 : 10.5)), Math.min(1, dt * 4));

}

function loop() {

}

function endRun(how) {

  cC.appendChild(act);
  cols.appendChild(cC);

}
function drawString() {
  var g = $('jgrid'), svg = $('jstring');
  if (!g || !svg) return;
  var raids = g.querySelectorAll('[data-raid]');
  var base = g.getBoundingClientRect();
  svg.setAttribute('width', base.width); svg.setAttribute('height', base.height);
  svg.setAttribute('viewBox', '0 0 ' + base.width + ' ' + base.height);
  var pts = [], dots = '';
  for (var i = 0; i < raids.length; i++) {
    var r = raids[i].getBoundingClientRect();
    var x = r.left - base.left + r.width / 2, y = r.top - base.top + 8;
    pts.push(x.toFixed(1) + ',' + y.toFixed(1));
    dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4.5" fill="#c4332a" stroke="#7a1712" stroke-width="1.5"/>';
  }
  svg.innerHTML = (pts.length > 1 ? '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#c4332a" stroke-width="2" stroke-linejoin="round" opacity="0.85"/>' : '') + dots;
}

/* ================= 情報簿（含月相祕密圖） ================= */
var orbitAng = 90;
function openNotebook() {
  openSheet(function (s) {
    s.appendChild(el('div', 'big-stamp bad', '情報簿'));
    s.appendChild(el('h2', '', '貓頭鷹的祕密圖'));
    var top = el('div', 'helper-top');
    var oc = makeCanvas(280, 280); oc.id = 'orbitCanvas';
    top.appendChild(oc);
    var view = el('div', '');
    view.style.display = 'flex'; view.style.flexDirection = 'column'; view.style.gap = '6px'; view.style.alignItems = 'center'; view.style.textAlign = 'center';
    var vc = makeCanvas(120, 120);
    var nm = el('div', '', ''); nm.style.fontSize = '26px'; nm.style.fontWeight = '700';
    view.appendChild(el('div', '', '從臺灣看到的月亮'));
    view.appendChild(vc); view.appendChild(nm);
    view.appendChild(el('p', '', '拖曳左圖的月亮，讓它繞地球轉一圈。'));
    view.appendChild(el('p', '', '太陽永遠照亮月亮的一半。月相<b>不是</b>地球的影子造成的，地球的影子在背對太陽的那一邊。'));
    top.appendChild(view);
    s.appendChild(top);
    var grid = el('div', 'phase-grid');
    for (var i = 0; i < 8; i++) {
      (function (i) {
        var c = el('button', 'phase-cell'); c.type = 'button';
        c.appendChild(miniMoon(46, PH[i].a, false));
        c.appendChild(el('b', '', PH[i].n));
        c.appendChild(el('span', '', '農曆' + PH[i].days + (PH[i].rise ? '<br>' + PH[i].rise + '升起' : '')));
        on(c, 'click', function () { orbitAng = PH[i].a; redraw(); });
        grid.appendChild(c);
      })(i);
    }
    s.appendChild(grid);
    if (C && C.notes.length) {
      s.appendChild(el('h2', '', '收集到的情報'));
      var nl = el('div', 'notes-list');
      for (var k = 0; k < C.notes.length; k++) { var nt = noteById(C.notes[k]); if (nt) nl.appendChild(el('div', 'sticky', '<div class="who">' + OWL_SVG + '貓頭鷹情報</div>' + nt.t)); }
      s.appendChild(nl);
    }
    var row = el('div', 'row'); row.appendChild(pbtn('收起情報簿', true, closeSheet)); s.appendChild(row);

    function halfLit(ctx, x, y, r, dark, light) {
      ctx.beginPath(); ctx.arc(x, y, r, 0, PI * 2); ctx.fillStyle = dark; ctx.fill();
      ctx.beginPath(); ctx.moveTo(x, y - r); ctx.arc(x, y, r, -PI / 2, PI / 2, false); ctx.closePath(); ctx.fillStyle = light; ctx.fill();
    }
    function redraw() {
      var ctx = oc.getContext('2d'), W = 280, cx = 140, cy = 140, Rr = 98;
      ctx.fillStyle = '#0e1a33'; ctx.fillRect(0, 0, W, W);
      ctx.strokeStyle = 'rgba(255,199,102,0.45)'; ctx.lineWidth = 1.5;
      for (var y = 20; y < W; y += 28) { ctx.beginPath(); ctx.moveTo(W - 6, y); ctx.lineTo(W - 38, y); ctx.moveTo(W - 38, y); ctx.lineTo(W - 32, y - 4); ctx.moveTo(W - 38, y); ctx.lineTo(W - 32, y + 4); ctx.stroke(); }
      ctx.fillStyle = '#ffc766'; ctx.font = '13px "Noto Sans TC", sans-serif'; ctx.textAlign = 'right'; ctx.fillText('太陽光', W - 8, W - 8);
      ctx.setLineDash([3, 5]); ctx.strokeStyle = 'rgba(200,210,235,0.5)'; ctx.beginPath(); ctx.arc(cx, cy, Rr, 0, PI * 2); ctx.stroke(); ctx.setLineDash([]);
      halfLit(ctx, cx, cy, 20, '#1d3d78', '#5fa0e8');
      ctx.fillStyle = '#c8d2ea'; ctx.textAlign = 'center'; ctx.fillText('地球', cx, cy + 36);
      var rad = orbitAng * PI / 180, mx = cx + Math.cos(rad) * Rr, my = cy - Math.sin(rad) * Rr;
      halfLit(ctx, mx, my, 12, '#3a4060', '#f3e6b8');
      ctx.fillText('月亮', mx, my + 26);
      ctx.textAlign = 'left'; ctx.fillText('從北極上方往下看', 8, 18);
      var v = vc.getContext('2d'); v.clearRect(0, 0, 120, 120);
      v.fillStyle = '#0e1a33'; v.beginPath(); v.arc(60, 60, 59, 0, PI * 2); v.fill();
      drawMoon(v, 60, 60, 44, orbitAng, { outline: true, outlineColor: 'rgba(200,210,235,0.6)', glow: true });
      nm.textContent = PH[Math.round(orbitAng / 45) % 8].n;
    }
    var drag = false;
    function setA(e) { var rc = oc.getBoundingClientRect(); var x = (e.clientX - rc.left) * 280 / rc.width - 140, y = (e.clientY - rc.top) * 280 / rc.height - 140; orbitAng = (Math.atan2(-y, x) * 180 / PI + 360) % 360; redraw(); }
    on(oc, 'pointerdown', function (e) { drag = true; oc.setPointerCapture(e.pointerId); setA(e); });
    on(oc, 'pointermove', function (e) { if (drag) setA(e); });
    on(oc, 'pointerup', function () { drag = false; });
    on(oc, 'pointercancel', function () { drag = false; });
    redraw();
  }, true, true);
}

/* ================= 結案 ================= */
function journalGrid() {
  var g = el('div', 'final-grid');
  for (var n = 0; n < 30; n++) {
    var e = C.journal[n], ld = lunarAfter(C.startLD, n);
    var c = el('div');
    c.appendChild(miniMoon(40, angleOf(ld), false));
    c.appendChild(el('b', '', PH[phaseIdx(ld)].n));
    c.appendChild(el('span', '', lunarName(ld) + (e && e.raided ? (e.ok ? ' 得手' : ' 被發現') : '')));
    g.appendChild(c);
  }
  return g;
}
function showFinale() {
  C.over = true; save();
  boardMode = 'end'; showBoard();
  var raids = 0, oks = 0, total = 0;
  for (var i = 0; i < C.journal.length; i++) { var e = C.journal[i]; if (e.raided) { raids++; if (e.ok) oks++; total += e.got; } }
  var stars = C.hungry === 0 ? (C.stock >= 6 ? 3 : 2) : 1;
  openSheet(function (s) {
    s.appendChild(el('div', 'big-stamp ok', '結案'));
    s.appendChild(el('h2', '', '30 個夜晚撐過去了！'));
    s.appendChild(el('p', 'loot-line', '出動 <b>' + raids + '</b> 次，平安得手 <b>' + oks + '</b> 次，一共帶回 <b>' + total + '</b> 隻田鼠，剩下存糧 <b>' + C.stock + '</b> 隻。評價：' + ['', '一顆', '兩顆', '三顆'][stars] + '月亮。'));
    s.appendChild(el('div', 'why ok', '這就是你的月相日記：月亮從盈凸月變成滿月，再一天天變瘦成下弦月、殘月、新月，然後又長回來。一輪大約 <b>29.5 天</b>，和農曆一個月差不多。初一新月、初七八上弦月、十五六滿月、廿二三下弦月。'));
    s.appendChild(journalGrid());
    var row = el('div', 'row');
    row.appendChild(pbtn('打開情報簿', false, openNotebook));
    row.appendChild(pbtn('再挑戰一個月', true, function () { newCampaign(); showPlan(); }));
    s.appendChild(row);
  }, true);
}
function showFail() {
  C.over = true; save();
  boardMode = 'end'; showBoard();
  openSheet(function (s) {
    s.appendChild(el('div', 'big-stamp bad', '行動失敗'));
    s.appendChild(el('h2', '', '小石虎餓壞了'));
    s.appendChild(el('p', '', '第 ' + C.night + ' 晚，存糧吃光太多次。石虎媽媽只好帶著小石虎搬家。'));
    s.appendChild(el('div', 'why', '小技巧：看計畫板上的時間軸，挑月亮<b>不在天上</b>的時段出門。新月前後整晚都很暗；下弦月要趁前半夜，上弦月要等後半夜。'));
    s.appendChild(journalGrid());
    var row = el('div', 'row'); row.appendChild(pbtn('重新開始一個月', true, function () { newCampaign(); showPlan(); })); s.appendChild(row);
  }, true);
}

var suspectURL = '';
function takeSuspectPhoto() {
  try {
    var prev = renderer.getSize(new THREE.Vector2());
    renderer.setSize(480, 360, false);
    camera.aspect = 480 / 360; camera.updateProjectionMatrix();
    player.position.set(0, 0, 8); player.rotation.y = -0.7;
    setNight(0.55);
    camera.position.set(2.2, 1.6, 5.4); camera.lookAt(0.1, 0.65, 7.8);
    renderer.render(scene, camera);
    suspectURL = renderer.domElement.toDataURL('image/jpeg', 0.85);
    renderer.setSize(prev.x, prev.y, false); onResize();
    player.position.set(0, 0, 17); player.rotation.y = 0;
  } catch (e) { suspectURL = ''; }
}
